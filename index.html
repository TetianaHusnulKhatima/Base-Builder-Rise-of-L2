<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>1. Base Builder</title><style>body{background:#0052FF;color:#fff;font-family:sans-serif;text-align:center;}canvas{background:#0a0b0d;border:2px solid #fff;}</style></head>
<body>
<h1>1. Base Builder: Rise of L2</h1>
<canvas id="c" width="300" height="300"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
let x=120, score=0, block={x:50, y:0};
document.onmousemove = e => x = e.clientX - 50;
function loop() {
    ctx.clearRect(0,0,300,300);
    block.y += 3;
    if(block.y > 300) { block.y = 0; block.x = Math.random()*260; }
    if(block.y > 260 && block.x > x && block.x < x+60) { score++; block.y = 0; block.x = Math.random()*260; }
    ctx.fillStyle = '#0052FF'; ctx.fillRect(x, 270, 60, 15);
    ctx.fillStyle = '#00D1FF'; ctx.fillRect(block.x, block.y, 20, 20);
    ctx.fillStyle = '#fff'; ctx.fillText('TPS: '+score, 10, 20);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
